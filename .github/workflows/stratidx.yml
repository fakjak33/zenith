name: STRATEGY INDICES

on:
  schedule:
    - cron: "0 12 * * 2-6"      # Cboe posts strategy-benchmark closes overnight
  workflow_dispatch:

permissions:
  contents: write               # commit data/stratidx/

concurrency:
  group: stratidx
  cancel-in-progress: false

jobs:
  stratidx:
    runs-on: ubuntu-latest
    # 18 Cboe CSVs + 10 vol indices + ~500 S&P 500 price histories (breadth): ~5 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build strategy indices
        run: python -m zenith.stratidx.compute --action auto

      - name: Commit STRATEGY INDICES data
        run: |
          git config user.name "zenith-bot"
          git config user.email "zenith-bot@users.noreply.github.com"
          git pull --rebase --autostash
          git add -A data/stratidx/
          if git diff --cached --quiet; then
            echo "No STRATEGY INDICES changes."
          else
            git commit -m "stratidx: $(date -u +%Y-%m-%d) auto"
            git push
          fi
