name: VOL SCREENER chains

# Three snapshots per trading day (ET): am 10:15, mid 12:45, close 15:30.
# GitHub starts this repo's scheduled runs hours late (4-8 h has been typical),
# so the run is triggered in the middle of the night and each job sleeps until
# its slot. `hold` absorbs the early part of the night (a job lives 6 h at most).
# The later crons are backups if the first is dropped: they queue behind the
# day's run and the gate skips every slot already built or already past.

on:
  schedule:
    - cron: "0 6 * * 1-5"       # 01:00 EST / 02:00 EDT
    - cron: "15 15 * * 1-5"     # backup
    - cron: "35 19 * * 1-5"     # backup
  workflow_dispatch:
    inputs:
      action:
        description: "auto (gated, waits for each slot) or force (build now)"
        default: "auto"
      slot:
        description: "all, am, mid or close"
        default: "all"

permissions:
  contents: write               # commit data/volscreen/ + publish the history assets

concurrency:
  group: volscreen
  cancel-in-progress: false

jobs:
  hold:
    if: (github.event.inputs.slot || 'all') == 'all' && (github.event.inputs.action || 'auto') != 'force'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sleep until 5 h before the am slot
        run: python -m zenith.volscreen.compute --wait --slot am --lead 300 --max-wait 340

  # force + all builds ONCE, as whichever slot is open now ("now"): forcing all
  # three back to back would write a midday snapshot into the close history
  am:
    needs: hold
    if: ${{ !cancelled() && contains(fromJSON('["all", "am"]'), github.event.inputs.slot || 'all') }}
    uses: ./.github/workflows/volscreen-build.yml
    with:
      slot: ${{ (github.event.inputs.action == 'force' && (github.event.inputs.slot || 'all') == 'all') && 'now' || 'am' }}
      action: ${{ github.event.inputs.action || 'auto' }}

  mid:
    needs: am
    if: ${{ !cancelled() && contains(fromJSON('["all", "mid"]'), github.event.inputs.slot || 'all') && !(github.event.inputs.action == 'force' && (github.event.inputs.slot || 'all') == 'all') }}
    uses: ./.github/workflows/volscreen-build.yml
    with:
      slot: mid
      action: ${{ github.event.inputs.action || 'auto' }}

  close:
    needs: mid
    if: ${{ !cancelled() && contains(fromJSON('["all", "close"]'), github.event.inputs.slot || 'all') && !(github.event.inputs.action == 'force' && (github.event.inputs.slot || 'all') == 'all') }}
    uses: ./.github/workflows/volscreen-build.yml
    with:
      slot: close
      action: ${{ github.event.inputs.action || 'auto' }}
