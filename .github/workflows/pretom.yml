name: PRETOM compute

on:
  schedule:
    - cron: "45 22 * * 1-5"     # weekdays after the US close (EST & EDT); the
                                # script self-gates on the trading calendar
  workflow_dispatch:
    inputs:
      action:
        description: "auto | backfill"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: pretom
  cancel-in-progress: false

jobs:
  pretom:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # lock/backfill days pull ~1000 tickers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PRETOM compute
        run: python -m zenith.pretom.compute --action ${{ github.event.inputs.action || 'auto' }}

      - name: Commit PRETOM data
        run: |
          git config user.name "zenith-bot"
          git config user.email "zenith-bot@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/pretom/
          if git diff --cached --quiet; then
            echo "No PRETOM changes."
          else
            git commit -m "pretom: $(date -u +%Y-%m-%d) ${{ github.event.inputs.action || 'auto' }}"
            git push
          fi
